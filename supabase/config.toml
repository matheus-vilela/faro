[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.received-whatsapp-message]
verify_jwt = false

[functions.parse-expense-document]
verify_jwt = false

[functions.refresh-whatsapp-draft-matches]
verify_jwt = false

[functions.focus-consulta-cnpj]
verify_jwt = false

[functions.focus-atualizar-certificado]
verify_jwt = false

[functions.focus-cria-empresa]
verify_jwt = false

[functions.focus-submit-delegated-certificado]
verify_jwt = false

[functions.focus-delete-empresa]
verify_jwt = false

# JWT validado no código (sessão ou service role) para permitir chamadas de `epoc-daily-sync`.
[functions.epoc-sync-csv]
verify_jwt = false

# Sync diário produtos+serviços+faturamento (CSVs no Storage + persist extras).
[functions.epoc-sync-day]
verify_jwt = false

[functions.epoc-daily-sync]
verify_jwt = false

# Pipeline Epoc Fase 1 (dispatcher + worker). Bearer = EPOC_DAILY_CRON_SECRET.
[functions.epoc-dispatcher]
verify_jwt = false

[functions.epoc-worker]
verify_jwt = false

# Orquestrador import CSV Epoc (heartbeat + self-call + watchdog).
[functions.epoc-csv-import-worker]
verify_jwt = false

# JWT validado no código (sessão + user_companies), como epoc-sync-csv para utilizadores.
[functions.epoc-validate-login]
verify_jwt = false

# Export CSV faturamento EPOC (dev tools). JWT validado no handler.
[functions.epoc-export-faturamento]
verify_jwt = false

# Export CSV venda de serviços EPOC (dev tools). JWT validado no handler.
[functions.epoc-export-venda-servicos]
verify_jwt = false

# Export CSV venda de produtos (produto sintético) EPOC (dev tools). JWT no handler.
[functions.epoc-export-venda-produtos]
verify_jwt = false

# Relatório estoque EPOC (dev tools, um dia). JWT no handler.
[functions.epoc-export-estoque]
verify_jwt = false

# Retry serviços/faturamento em dias com sync parcial. JWT no handler.
[functions.epoc-retry-daily-extras]
verify_jwt = false

# Secret no header Authorization (cron) ou JWT no handler — igual epoc-daily-sync.
[functions.focus-get-sync-nfe]
verify_jwt = false

# Pipeline NF-e Fase 1 (dispatcher + worker). Mesmo secret FOCUS_NFE_RECEBIDAS_CRON_SECRET.
[functions.nfe-dispatcher]
verify_jwt = false

[functions.nfe-worker]
verify_jwt = false

# JWT validado no handler (sessão + user_companies).
# Secrets (produção): `supabase secrets set OPENAI_API_KEY=...` — usado com ai_line_units_preview.
# Local: `supabase/functions/.env` ou painel; a resposta JSON inclui `openai_api_key_configured` (boolean).
#
# CORS a partir do browser: o gateway NÃO pode exigir JWT no OPTIONS (preflight sem Authorization).
# Se vires "preflight doesn't have HTTP ok status", faz deploy com JWT desligado no gateway, p.ex.:
#   supabase functions deploy dev-preview-nfe-xml --no-verify-jwt
[functions.dev-preview-nfe-xml]
verify_jwt = false

[functions.process-integration-csv-revenue-job]
verify_jwt = false

[functions.kick-csv-revenue-import-job]
verify_jwt = true

[functions.correlate-sold-purchased]
verify_jwt = false

# JWT validado no handler (sessão). Gateway sem JWT para o preflight CORS.
[functions.notify-checklist-rework]
verify_jwt = false

[functions.notify-inventory-count-sessions]
verify_jwt = false

